---
- name: restart unbound
  systemd:
    name: unbound
    state: restarted

- name: restart pihole-ftl
  systemd:
    name: pihole-FTL
    state: restarted

- name: restart dhcpcd
  systemd:
    name: dhcpcd
    state: restarted

- name: reload systemd
  systemd:
    daemon_reload: true

- name: reload keepalived
  systemd:
    name: keepalived
    state: reloaded
  when: lankit_dns_ha_start | default(true) | bool
